<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>College Details - MahaCollege</title><link rel="stylesheet" href="style.css">
<style>
.details-page{max-width:1150px;margin:45px auto;padding:30px}.hero-card,.details-section{background:#fff;padding:28px;border-radius:15px;margin-bottom:22px;box-shadow:0 4px 18px rgba(0,0,0,.06)}.hero-card h1{margin-bottom:10px}.badges span{display:inline-block;background:#eef2ff;padding:7px 10px;border-radius:20px;margin:4px;font-size:13px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;border:1px solid #ddd;text-align:left;white-space:nowrap}th{background:#172554;color:#fff}.source{font-size:13px;color:#666}.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.profile-item{border:1px solid #e5e7eb;border-radius:12px;padding:18px;background:#fafafa}.profile-item h3{margin:0 0 8px}.profile-item p{margin:0;line-height:1.55}.links a{display:inline-block;margin:5px 8px 5px 0}.notice{padding:14px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px;border-radius:12px;background:#f8fafc}.stat b{display:block;font-size:20px;margin-bottom:5px}@media(max-width:800px){.profile-grid,.stat-grid{grid-template-columns:1fr}.details-page{padding:15px}}
</style></head>
<body id="auth-protected-page"><nav><div class="logo">🎓 MahaCollege</div><div class="menu"><a href="index.html">Home</a><a href="find-colleges.html">Colleges</a><a href="category-cutoffs.html">Cutoffs</a><a href="college-predictor.html">Predictor</a><a href="compare-colleges.html">Compare</a><a href="notifications.html">Notifications</a><a href="login.html" class="login-btn">Login</a></div></nav>
<main class="details-page" id="details"></main>
<script src="college-data.js"></script><script>
const id=new URLSearchParams(location.search).get('id')||'03175',c=COLLEGES.find(x=>x.id===id)||COLLEGES[0],p=c.profile||{};
document.title=c.shortName+' - MahaCollege';
const rows=c.cutoffs.filter(x=>[3,4,5,6].some(i=>typeof x[i]==='number')).sort((a,b)=>(b[6]??b[5]??b[4]??b[3]??-Infinity)-(a[6]??a[5]??a[4]??a[3]??-Infinity));
const sourceLinks=(p.sources||[]).map((u,i)=>`<a href="${u}" target="_blank" rel="noopener">Source ${i+1}</a>`).join('');
const seatText=p.seats||'See official CET Cell seat matrix.';
document.getElementById('details').innerHTML=`
<div class="hero-card"><h1>🎓 ${c.name}</h1><p>📍 ${c.city}, ${c.district}</p><p>Institute Code: <strong>${c.id}</strong> · ${c.status} · ${c.university}</p><div class="badges">${c.branches.map(b=>`<span>${b}</span>`).join('')}</div><p style="margin-top:15px">${p.overview||''}</p><div class="links"><a href="${p.cetProfile||'#'}" target="_blank" rel="noopener">Official CET Cell Profile ↗</a>${p.officialWebsite?`<a href="${p.officialWebsite}" target="_blank" rel="noopener">Official College Website ↗</a>`:''}</div></div>
<div class="details-section"><h2>College at a glance</h2><div class="stat-grid"><div class="stat"><b>${c.branches.length||'—'}</b>Listed branches</div><div class="stat"><b>${rows.length||'—'}</b>Loaded cutoff rows</div><div class="stat"><b>${c.region||'—'}</b>Region</div><div class="stat"><b>${c.status||'—'}</b>Institute type</div></div></div>
<div class="details-section"><h2>Campus, faculty, seats & student life</h2><div class="profile-grid">
<div class="profile-item"><h3>🏫 Campus</h3><p>${p.campus||'Not available yet.'}</p></div>
<div class="profile-item"><h3>🌿 Environment</h3><p>${p.environment||'Not available yet.'}</p></div>
<div class="profile-item"><h3>👨‍🏫 Faculty</h3><p>${p.faculty||'Not available yet.'}</p></div>
<div class="profile-item"><h3>💺 Seats & intake</h3><p>${seatText}</p></div>
<div class="profile-item"><h3>💰 Fees</h3><p>${p.fees||'Not available yet.'}</p></div>
<div class="profile-item"><h3>💼 Placements</h3><p>${p.placements||'Not available yet.'}</p></div>
<div class="profile-item"><h3>🏅 Accreditation</h3><p>${p.accreditation||'Not available yet.'}</p></div>
<div class="profile-item"><h3>🔬 Facilities</h3><p>${p.facilities||'Not available yet.'}</p></div>
</div></div>
<div class="details-section"><h2>📊 2026 CAP Cutoffs — All Rounds</h2><p class="source">CAP 1, CAP 2, CAP 3 and CAP 4 are shown from the loaded 2026–27 Maharashtra CET Cell cutoff dataset. A dash means that the official loaded data has no numeric value for that exact branch/category/seat-pool row in that round.</p><div class="table-wrap"><table><thead><tr><th>Branch</th><th>Category</th><th>Seat pool</th><th>CAP 1</th><th>CAP 2</th><th>CAP 3</th><th>CAP 4</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${typeof x[6]==='number'?x[6].toFixed(2):'—'}</td><td>${typeof x[5]==='number'?x[5].toFixed(2):'—'}</td><td>${typeof x[4]==='number'?x[4].toFixed(2):'—'}</td><td>${typeof x[3]==='number'?'<strong>'+x[3].toFixed(2)+'</strong>':'—'}</td></tr>`).join('')||'<tr><td colspan="7">No verified cutoff rows loaded for this college.</td></tr>'}</tbody></table></div><div class="links"><a href="https://cappublicdocs2026.blob.core.windows.net/documents/2026ENGG_CAP1_MH_CutOff_V1.pdf" target="_blank" rel="noopener">Official CAP 1 cutoff ↗</a><a href="https://cappublicdocs2026.blob.core.windows.net/documents/2026ENGG_CAP2_MH_CutOff.pdf" target="_blank" rel="noopener">Official CAP 2 cutoff ↗</a><a href="https://cappublicdocs2026.blob.core.windows.net/documents/2026ENGG_CAP3_MH_CutOff.pdf" target="_blank" rel="noopener">Official CAP 3 cutoff ↗</a><a href="https://cappublicdocs2026.blob.core.windows.net/documents/2026ENGG_CAP4_MH_CutOff.pdf" target="_blank" rel="noopener">Official CAP 4 cutoff ↗</a></div></div>
<div class="details-section"><h2>Admission information</h2><p>${p.admission||'See the current Maharashtra CET Cell brochure.'}</p><div class="notice"><strong>Data accuracy:</strong> Cutoffs and seat matrices are admission-cycle data. Campus, faculty, placement and facility information can change; this page labels information that has not yet been independently imported rather than inventing values.</div></div>
<div class="details-section"><h2>Official sources</h2><p class="source">${sourceLinks||'Official CET Cell source available from the button above.'}</p><p class="source">${DATA_SOURCE}</p></div>`;
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></body></html>
